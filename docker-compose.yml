services:
  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vegeai-postgres
    restart: always
    environment:
      POSTGRES_DB: vegeai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - vegeai_pgdata:/var/lib/postgresql/data
      - ./src/main/resources/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vegeai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vegeai-net

  # ── Redis Cache & Blacklist & Rate Limiting ───────────────────
  redis:
    image: redis:7-alpine
    container_name: vegeai-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - vegeai_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vegeai-net

  # ── VEGEAI Spring Boot Backend Service ───────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vegeai-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/vegeai
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-vegeai-super-secret-key-change-this-in-production-minimum-256-bits}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-giflvl123@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-pnpsiwgmapmdhqkr}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      OSM_OVERPASS_URLS: ${OSM_OVERPASS_URLS:-https://overpass.private.coffee/api/interpreter,https://overpass-api.de/api/interpreter}
      OSM_PHOTON_URL: ${OSM_PHOTON_URL:-https://photon.komoot.io/api/}
      OSM_USER_AGENT: ${OSM_USER_AGENT:-VEGEAI/1.0 (+https://github.com/cudatbusua/SWP391_VEGEAI_FRONTEND)}
    ports:
      - "8081:8081"
    networks:
      - vegeai-net

volumes:
  vegeai_pgdata:
    driver: local
  vegeai_redisdata:
    driver: local

networks:
  vegeai-net:
    driver: bridge
