# ============================================================
# VEGEAI Backend – Application Configuration
# ============================================================
spring.application.name=vegeai-backend

# ── Server ──────────────────────────────────────────────────
server.port=8081

# ── Database (PostgreSQL) ────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vegeai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ─────────────────────────────────────────────────────
# Generate a secure secret: openssl rand -hex 64
app.jwt.secret=${JWT_SECRET:vegeai-super-secret-key-change-this-in-production-minimum-256-bits}
app.jwt.expiration-minutes=15
app.jwt.refresh-expiration-days=1

# ── OTP ─────────────────────────────────────────────────────
app.otp.ttl-minutes=3
app.otp.resend-cooldown-seconds=30

# ── Email (SMTP) ─────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_USERNAME:noreply@vegeai.com}
app.mail.from-name=VEGEAI

# ── Spring Data Redis ─────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.data.redis.repositories.enabled=false

# ── Rate Limiting (Bucket4j + Redis Brute-Force & Guest Quota) ─
app.rate-limit.login.max-attempts=5
app.rate-limit.login.max-ip-attempts=20
app.rate-limit.login.window-minutes=15
app.rate-limit.guest-ai.max-requests=3
app.rate-limit.guest-ai.window-hours=24

# ── Springdoc / Swagger ──────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ── Logging ─────────────────────────────────────────────────
logging.level.com.vegeai=DEBUG
logging.level.org.springframework.security=WARN
