# Test profile — uses H2 in-memory database, disables external services
spring.application.name=vegeai-backend-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-secret-key-must-be-at-least-32-characters-long-for-hmac
app.jwt.expiration-minutes=15
app.jwt.refresh-expiration-days=1

app.otp.ttl-minutes=3
app.otp.resend-cooldown-seconds=30

# Disable mail during tests
spring.mail.host=localhost
spring.mail.port=3025
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
